server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: travel-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/travel_ai?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

bailian:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  default-model: ${DASHSCOPE_MODEL:qwen3.6-plus}
  file-model: ${DASHSCOPE_FILE_MODEL:qwen-long-latest}
  fallback-model: ${DASHSCOPE_FALLBACK_MODEL:qwen3.6-plus}
  embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
  max-tokens: ${DASHSCOPE_MAX_TOKENS:1800}
  connect-timeout-seconds: 8
  read-timeout-seconds: 180

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${APP_JWT_SECRET:change-this-to-a-very-long-random-secret-key-32-bytes-min}
    jwt-expire-seconds: ${APP_JWT_EXPIRE_SECONDS:86400}
  rate-limit:
    per-minute: ${APP_RATE_LIMIT_PER_MINUTE:120}
  api-audit:
    enabled: ${APP_API_AUDIT_ENABLED:true}
    include-all-api: ${APP_API_AUDIT_INCLUDE_ALL:true}
    candidate-prefixes:
      - /api/files/upload
      - /api/portal/categories
      - /api/portal/spot-plan
      - /api/travel/plan
      - /api/travel/budget
      - /api/travel/plan/files
      - /api/travel/file-qa
      - /api/v1/chat
      - /api/v1/knowledge
      - /api/v1/vector
      - /api/v1/users
  vector-db:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:travel_knowledge}
    vector-dimension: ${QDRANT_VECTOR_DIMENSION:1024}
    distance: ${QDRANT_DISTANCE:Cosine}
    create-if-missing: ${QDRANT_CREATE_IF_MISSING:true}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:80}
    top-k: ${RAG_TOP_K:1}
    context-max-chars: ${RAG_CONTEXT_MAX_CHARS:4000}
    recall-top-k: ${RAG_RECALL_TOP_K:24}
    lexical-pool-size: ${RAG_LEXICAL_POOL_SIZE:300}
    vector-weight: ${RAG_VECTOR_WEIGHT:0.65}
    rerank-coverage-weight: ${RAG_RERANK_COVERAGE_WEIGHT:0.20}
    agent-max-steps: ${RAG_AGENT_MAX_STEPS:8}
  prompt:
    external-dir: ${APP_PROMPT_EXTERNAL_DIR:}
  flight:
    enabled: ${APP_FLIGHT_ENABLED:true}
    domestic-provider: ${APP_FLIGHT_DOMESTIC_PROVIDER:ctrip}
    international-provider: ${APP_FLIGHT_INTERNATIONAL_PROVIDER:aviationstack}
    provider: ${APP_FLIGHT_PROVIDER:aviationstack}
    api-key: ${APP_FLIGHT_API_KEY:ffdef7bb33e83261f8e90740fda9d37e}
    base-url: ${APP_FLIGHT_BASE_URL:https://api.aviationstack.com/v1/flights}
    ctrip-base-url: ${APP_FLIGHT_CTRIP_BASE_URL:https://flights.ctrip.com/online/list/oneway-{dep}-{arr}}
    limit: ${APP_FLIGHT_LIMIT:5}
    connect-timeout-seconds: ${APP_FLIGHT_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${APP_FLIGHT_READ_TIMEOUT_SECONDS:10}
  train:
    enabled: ${APP_TRAIN_ENABLED:true}
    base-url: ${APP_TRAIN_BASE_URL:https://kyfw.12306.cn/otn/leftTicket/query}
    alternative-base-urls:
      - ${APP_TRAIN_ALT_BASE_URL_1:https://kyfw.12306.cn/otn/leftTicket/queryG}
      - ${APP_TRAIN_ALT_BASE_URL_2:https://kyfw.12306.cn/otn/leftTicket/queryO}
    cookie-bootstrap-enabled: ${APP_TRAIN_COOKIE_BOOTSTRAP_ENABLED:true}
    bootstrap-url: ${APP_TRAIN_BOOTSTRAP_URL:https://kyfw.12306.cn/otn/leftTicket/init}
    limit: ${APP_TRAIN_LIMIT:6}
    connect-timeout-seconds: ${APP_TRAIN_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${APP_TRAIN_READ_TIMEOUT_SECONDS:12}
  hotel:
    enabled: ${APP_HOTEL_ENABLED:true}
    provider: ${APP_HOTEL_PROVIDER:overpass}
    geocode-url: ${APP_HOTEL_GEOCODE_URL:https://geocoding-api.open-meteo.com/v1/search}
    overpass-url: ${APP_HOTEL_OVERPASS_URL:https://overpass-api.de/api/interpreter}
    radius-meters: ${APP_HOTEL_RADIUS_METERS:6000}
    limit: ${APP_HOTEL_LIMIT:6}
    connect-timeout-seconds: ${APP_HOTEL_CONNECT_TIMEOUT_SECONDS:5}
    read-timeout-seconds: ${APP_HOTEL_READ_TIMEOUT_SECONDS:12}
  web-search:
    enabled: ${APP_WEB_SEARCH_ENABLED:true}
    provider: ${APP_WEB_SEARCH_PROVIDER:baidu}
    base-url: ${APP_WEB_SEARCH_BASE_URL:https://www.baidu.com/s}
    fallback-provider: ${APP_WEB_SEARCH_FALLBACK_PROVIDER:duckduckgo}
    fallback-base-url: ${APP_WEB_SEARCH_FALLBACK_BASE_URL:https://api.duckduckgo.com/}
    limit: ${APP_WEB_SEARCH_LIMIT:5}
    min-rerank-score: ${APP_WEB_SEARCH_MIN_RERANK_SCORE:0.08}
    connect-timeout-seconds: ${APP_WEB_SEARCH_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${APP_WEB_SEARCH_READ_TIMEOUT_SECONDS:5}
