server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: travel-assistant
  datasource:
    url: jdbc:mysql://localhost:3306/travel_ai?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

bailian:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  default-model: ${DASHSCOPE_MODEL:qwen-plus}
  file-model: ${DASHSCOPE_FILE_MODEL:qwen-long-latest}
  fallback-model: ${DASHSCOPE_FALLBACK_MODEL:qwen-flash-latest}
  embedding-model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}
  max-tokens: ${DASHSCOPE_MAX_TOKENS:1800}
  connect-timeout-seconds: 8
  read-timeout-seconds: 90

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt-secret: ${APP_JWT_SECRET:change-this-to-a-very-long-random-secret-key-32-bytes-min}
    jwt-expire-seconds: ${APP_JWT_EXPIRE_SECONDS:86400}
  rate-limit:
    per-minute: ${APP_RATE_LIMIT_PER_MINUTE:120}
  vector-db:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:travel_knowledge}
    vector-dimension: ${QDRANT_VECTOR_DIMENSION:1024}
    distance: ${QDRANT_DISTANCE:Cosine}
    create-if-missing: ${QDRANT_CREATE_IF_MISSING:true}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:80}
    top-k: ${RAG_TOP_K:5}
    context-max-chars: ${RAG_CONTEXT_MAX_CHARS:4000}
